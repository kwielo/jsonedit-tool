<!DOCTYPE HTML>
<html style="height: 98%;"">
<head>
    <title>JSON editor - wielo's toolkit</title>
    <!-- when using the mode "code", it's important to specify charset utf-8 -->
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8">

    <link rel="shortcut icon" href="media/fav_icon.png" />

    <link href="media/jsoneditor.min.css" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="https://unpkg.com/spectre.css/dist/spectre-icons.min.css">
    <script src="media/jsoneditor.min.js"></script>
    <style type="text/css" media="screen">
        .act_btn {
            font-size: 28px;
            text-decoration: none;
        }
    </style>
</head>
<body style="height: 100%; width: 100%;">
    <div id="editor_1" style="width: 48%; height: 100%; float: left;"></div>
    <div style="width: 3%; height: 100%; float: left; text-align: center;">
        <div style="width: 100%; height: 20%;"></div>
        <a href="#" class="act_btn" onclick="clr()" title="Clear both."><i class="icon icon-cross"></i></a><br /><br />
        <a href="#" class="act_btn" onclick="l2r()" title="Copy left to right."><i class="icon icon-arrow-right"></i></a><br /><br />
        <a href="#" class="act_btn" onclick="r2l()" title="Copy right to left."><i class="icon icon-arrow-left"></i></a><br />
    </div>
    <div id="editor_2" style="width: 48%; height: 100%; float: left;"></div>

</body>


<script>
    // create the editor
    var container1 = document.getElementById("editor_1");
    var container2 = document.getElementById("editor_2");
    var options = {
        statusBar: false
    };
    var options1 = Object.assign({
        "mode": "code"
    }, options);
    var options2 = Object.assign({
        "mode": "tree"
    }, options);
    var editor1 = new JSONEditor(container1, options1);
    var editor2 = new JSONEditor(container2, options2);

    editor1.set({});
    editor2.set({});

    // get json
    var json = editor1.get();

    function clr() {
        if (true === confirm('You sure?')) {
            editor1.set({});
            editor2.set({});
        }
    }
    function l2r() {
        editor2.set(editor1.get());
    }
    function r2l() {
        editor1.set(editor2.get());
    }
</script>

</html>
