<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON editor - wielo's toolkit</title>
    <link rel="shortcut icon" href="/media/fav_icon.png">
</head>
<body>
    <nav id="tabbar" class="tabbar">
        <button type="button" id="btn-clear-all" class="tab_tool" title="Clear all stored data." aria-label="Clear all stored data">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
        </button>
        <button type="button" id="btn-add-tab" class="tab_add" title="New tab." aria-label="New tab">+</button>
    </nav>
    <main class="app">
        <div id="left-panes" class="panes"></div>
        <div class="actions">
            <button type="button" id="btn-clear" class="act_btn" title="Clear both." aria-label="Clear both">&#10005;</button>
            <button type="button" id="btn-l2r" class="act_btn" title="Copy left to right." aria-label="Copy left to right">&#8594;</button>
            <button type="button" id="btn-r2l" class="act_btn" title="Copy right to left." aria-label="Copy right to left">&#8592;</button>
            <button type="button" id="btn-theme" class="act_btn" title="Toggle dark mode." aria-label="Toggle dark mode">&#9790;</button>
        </div>
        <div id="right-panes" class="panes"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
    <!-- Matomo -->
    <script type="text/javascript">
      var _paq = _paq || [];
      /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
      _paq.push(['trackPageView']);
      _paq.push(['enableLinkTracking']);
      (function() {
        var u="//stats25.mydevil.net/";
        _paq.push(['setTrackerUrl', u+'piwik.php']);
        _paq.push(['setSiteId', '46']);
        var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
        g.type='text/javascript'; g.async=true; g.defer=true; g.src=u+'piwik.js'; s.parentNode.insertBefore(g,s);
      })();
    </script>
    <!-- End Matomo Code -->
</body>
</html>
