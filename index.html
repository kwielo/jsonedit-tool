<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON editor - wielo's toolkit</title>
    <link rel="shortcut icon" href="/media/fav_icon.png">
</head>
<body>
    <main class="app">
        <div id="editor-left" class="editor"></div>
        <div class="actions">
            <button type="button" id="btn-clear" class="act_btn" title="Clear both." aria-label="Clear both">&#10005;</button>
            <button type="button" id="btn-l2r" class="act_btn" title="Copy left to right." aria-label="Copy left to right">&#8594;</button>
            <button type="button" id="btn-r2l" class="act_btn" title="Copy right to left." aria-label="Copy right to left">&#8592;</button>
        </div>
        <div id="editor-right" class="editor"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
    <!-- Matomo -->
    <script type="text/javascript">
      var _paq = _paq || [];
      /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
      _paq.push(['trackPageView']);
      _paq.push(['enableLinkTracking']);
      (function() {
        var u="//stats25.mydevil.net/";
        _paq.push(['setTrackerUrl', u+'piwik.php']);
        _paq.push(['setSiteId', '46']);
        var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
        g.type='text/javascript'; g.async=true; g.defer=true; g.src=u+'piwik.js'; s.parentNode.insertBefore(g,s);
      })();
    </script>
    <!-- End Matomo Code -->
</body>
</html>
